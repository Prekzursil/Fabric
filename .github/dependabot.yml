version: 2
updates:
  # Go module at the repo root (go.mod / go.sum).
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"

  # SvelteKit web UI (package.json + pnpm-lock.yaml / package-lock.json).
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"

  # Python tooling under scripts/python_ui (requirements.txt).
  - package-ecosystem: "pip"
    directory: "/scripts/python_ui"
    schedule:
      interval: "weekly"

  # Docker base images used by scripts/docker/Dockerfile.
  - package-ecosystem: "docker"
    directory: "/scripts/docker"
    schedule:
      interval: "weekly"

  # GitHub Actions used by workflows in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
